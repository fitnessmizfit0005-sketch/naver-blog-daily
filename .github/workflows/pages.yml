name: Deploy Pages (docs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: GPT 번들 2개로 나누기 (블로그 3개씩)
        run: python3 tools/split_gpt_bundle.py docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 아티팩트 등록 대기 (deploy가 너무 빨리 찾으면 0개로 실패함)
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
